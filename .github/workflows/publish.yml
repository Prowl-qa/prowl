name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # npm's OIDC trusted publishing needs npm >= 11.5.1; Node 20 bundles npm 10.
      - name: Upgrade npm for OIDC publishing
        run: npm install -g npm@11

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Auth is npm Trusted Publishing (OIDC): the `id-token: write` permission
      # lets npm mint a short-lived credential from the workflow's identity — no
      # NPM_TOKEN secret, nothing to rotate. Requires the trusted publisher to be
      # configured on the npm package (prowl-tools → Settings → Trusted Publisher:
      # GitHub Actions, repo prowl-tools/prowl, workflow publish.yml). Provenance
      # is on by default with trusted publishing; the flag stays for clarity.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Release notes are empty for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
