name: Mobile E2E (self-hosted)

# Real end-to-end device-verification for the Android + iOS drivers (PROWL-061).
# This turns the manual smoke tests that caught the uiautomator2 wire-shape bug
# (PROWL-058) and the WebDriverAgent readiness hang (PROWL-059) into a machine-run
# gate on the provisioned self-hosted Mac (Apple Silicon, Xcode + Android SDK, a
# persistent `prowl-ci` AVD and a `prowl-ci-ios` simulator).
#
# Trigger choice:
#   * workflow_dispatch — always available for on-demand verification and is the
#     way the owner runs this gate after merge (its live run cannot happen in the
#     hosted `npm test` job).
#   * pull_request — so same-repo PRs get the gate automatically, BUT the job is
#     guarded to SKIP CLEANLY (not fail, not hang) for anything that cannot reach
#     the box: it only runs in `prowl-tools/prowl` and only for a workflow_dispatch
#     or a PR whose head is this same repo (never a fork). Forks / outside PRs
#     evaluate the `if` to false and the job is reported as skipped (green), so
#     they never queue against an offline/absent self-hosted runner.
on:
  workflow_dispatch:
  pull_request:

# Own concurrency group: the box also serves Sentwise's `prowl-qa`, so never
# collide. Cancel a superseded in-flight run rather than stacking device work.
concurrency:
  group: prowl-mobile-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-e2e:
    name: Android + iOS device verification
    # Skip-cleanly guard (see header): this repo only, and only a dispatch or a
    # same-repo PR (fork PRs have a different head repo and are skipped green).
    if: >-
      github.repository == 'prowl-tools/prowl' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, prowl-mobile]
    timeout-minutes: 45
    env:
      ANDROID_AVD: prowl-ci
      IOS_SIM: prowl-ci-ios
      # aapt lives under the pinned build-tools; keep it discoverable for .apk
      # targets (bare-package targets like the ones below do not need it).
      ANDROID_BUILD_TOOLS: /opt/homebrew/share/android-commandlinetools/build-tools/35.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build the CLI
        run: |
          npm ci
          npm run build
          echo "PROWL=node $GITHUB_WORKSPACE/dist/index.js" >> "$GITHUB_ENV"

      - name: Scaffold scratch hunts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android/.prowl/hunts" "$RUNNER_TEMP/ios/.prowl/hunts"

          # --- Android: com.android.settings ---
          cat > "$RUNNER_TEMP/android/.prowl/config.yml" <<'YAML'
          target:
            type: android
            app: "com.android.settings"
            coldStart: true
          browser:
            headless: true
            timeout: 60000
          artifacts:
            screenshots: "all"
          guardrails:
            maxSteps: 50
            allowedApps:
              - "com.android.settings"
          YAML
          cat > "$RUNNER_TEMP/android/.prowl/hunts/android-smoke.yml" <<'YAML'
          name: android-smoke
          description: Android Settings device-verification smoke (PROWL-061)
          steps:
            # Wait for the Settings home list to render.
            - waitForSelector:
                selector: "text=Network & internet"
                timeout: 60000
            # The SAME list container must resolve by a fully-qualified id= …
            - assert:
                visible: "id=com.android.settings:id/recycler_view"
            # … and by a bare id= (auto-qualified with the app package to the same node).
            # NOTE: the resource-id can differ across Android versions; if the gate
            # fails here on the runner's AVD, dump it (`adb shell uiautomator dump`)
            # and adjust this id — this is the intended post-merge verification step.
            - assert:
                visible: "id=recycler_view"
            # --- scroll gesture proof (PROWL-080): the Settings home is a
            # scrollable list, so a down-swipe must reveal a below-the-fold row.
            # NOTE: the exact bottom-of-list label varies across Android
            # versions; if the gate fails here on the runner's AVD, dump the
            # tree (`adb shell uiautomator dump`) and adjust the text= below.
            - assert:
                notVisible: "text=Accessibility"
            - scroll:
                direction: down
                amount: 1200
            - waitForSelector:
                selector: "text=Accessibility"
                timeout: 20000
            - assert:
                visible: "text=Accessibility"
            # Return to the top row with the same bounded bidirectional scroll
            # helper used by real hunts; one fixed upward swipe is too short on
            # the live AVD after revealing the below-the-fold row.
            - scrollTo:
                selector: "text=Network & internet"
            - assert:
                visible: "text=Network & internet"
            # Tap an entry by its visible-text shorthand.
            - click: "Network & internet"
            - screenshot:
                name: android-network-internet
          YAML

          # --- iOS: com.apple.Preferences (the PROWL-059 smoke) ---
          cat > "$RUNNER_TEMP/ios/.prowl/config.yml" <<'YAML'
          target:
            type: ios
            app: "com.apple.Preferences"
            udid: "{{IOS_SIM_UDID}}"
          browser:
            headless: true
            timeout: 60000
          artifacts:
            screenshots: "all"
          guardrails:
            maxSteps: 50
            allowedApps:
              - "com.apple.Preferences"
          YAML
          cat > "$RUNNER_TEMP/ios/.prowl/hunts/ios-smoke.yml" <<'YAML'
          name: ios-smoke
          description: iOS Settings device-verification smoke (PROWL-059 / PROWL-061)
          steps:
            - waitForSelector:
                selector: "text=General"
                timeout: 60000
            - assert:
                visible: "text=General"
            - click: "General"
            - waitForSelector:
                selector: "text=About"
                timeout: 60000
            - assert:
                visible: "text=About"
            # --- scroll gesture proof (PROWL-080): the General page is a long
            # scrollable list, so a down-swipe must reveal a below-the-fold row.
            - assert:
                notVisible: "text=Transfer or Reset iPhone"
            - scroll:
                direction: down
                amount: 600
            - waitForSelector:
                selector: "text=Transfer or Reset iPhone"
                timeout: 20000
            - assert:
                visible: "text=Transfer or Reset iPhone"
            # Return to the top before continuing the original About smoke.
            - scroll:
                direction: up
                amount: 600
            - waitForSelector:
                selector: "text=About"
                timeout: 20000
            - click: "About"
            - waitForSelector:
                selector: "text=Name"
                timeout: 60000
            - screenshot:
                name: ios-general-about
          YAML

      # PROWL-081 / INFRA-001: boot the emulator as a HARD infra gate. A failure
      # to reach `sys.boot_completed` (or a package manager that never answers)
      # is a runner/infra fault, not a hunt fault, so it must stop the job before
      # any hunt runs — never surface as a downstream `waitForSelector` timeout.
      # We also retry the boot once and settle on package-manager readiness
      # (Settings cannot launch until `pm` answers), logging what we waited for.
      - name: Boot the Android emulator
        run: |
          set -uo pipefail
          adb start-server

          # Bring up the emulator and wait (up to ~300s total) for device
          # connection and sys.boot_completed.
          wait_for_boot() {
            local attempt="$1" start elapsed boot_deadline_s device_connected
            start=$SECONDS
            boot_deadline_s=300
            device_connected=0
            # Headless boot, no snapshot — matches the runner-verified invocation.
            nohup emulator -avd "$ANDROID_AVD" -no-window -no-audio -no-boot-anim -no-snapshot \
              > "$RUNNER_TEMP/emulator.log" 2>&1 &
            echo "Boot attempt ${attempt}: emulator launched (pid $!); waiting for device…"
            while [ $((SECONDS - start)) -lt "$boot_deadline_s" ]; do
              if adb devices | awk 'NR > 1 && $2 == "device" { found=1 } END { exit found ? 0 : 1 }'; then
                elapsed=$((SECONDS - start))
                echo "Boot attempt ${attempt}: adb device connected after ${elapsed}s"
                device_connected=1
                break
              fi
              sleep 2
            done
            if [ "$device_connected" != "1" ]; then
              echo "Boot attempt ${attempt}: adb device did not connect after $((SECONDS - start))s"
              return 1
            fi
            while [ $((SECONDS - start)) -lt "$boot_deadline_s" ]; do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                elapsed=$((SECONDS - start))
                echo "Boot attempt ${attempt}: sys.boot_completed reached after ${elapsed}s"
                return 0
              fi
              sleep 2
            done
            echo "Boot attempt ${attempt}: sys.boot_completed NOT reached after $((SECONDS - start))s"
            return 1
          }

          # Post-boot settle: the package manager must answer before Settings can
          # launch, else the hunt sees an empty screen and times out spuriously.
          wait_for_package_manager() {
            local start elapsed
            start=$SECONDS
            for _ in $(seq 1 30); do
              if adb shell pm path android >/dev/null 2>&1; then
                elapsed=$((SECONDS - start))
                echo "Package manager ready after ${elapsed}s"
                return 0
              fi
              sleep 2
            done
            echo "Package manager NOT ready after $((SECONDS - start))s"
            return 1
          }

          booted=0
          for attempt in 1 2; do
            if wait_for_boot "$attempt" && wait_for_package_manager; then
              booted=1
              break
            fi
            echo "::warning::Android emulator boot attempt ${attempt} failed; killing and retrying"
            adb -s emulator-5554 emu kill || true
            adb kill-server || true
            adb start-server
            sleep 3
          done

          if [ "$booted" != "1" ]; then
            echo "::error::[infra] Android emulator failed to boot (sys.boot_completed / package manager) after 2 attempts — runner/infra failure, not a hunt failure"
            cat "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          adb shell input keyevent 82 || true   # dismiss the keyguard
          adb devices

      - name: Run the Android smoke hunt
        working-directory: ${{ runner.temp }}/android
        run: |
          set -euo pipefail
          # Persistent AVDs can retain a launcher ANR dialog from a prior run.
          # The Settings screen stays visible behind it, but the dialog owns the
          # active UI hierarchy, so uiautomator2 cannot resolve Settings rows.
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb shell am force-stop com.android.launcher3 || true
          $PROWL run android-smoke

      - name: Select iOS simulator runtime
        id: ios-runtime
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes | awk '/iOS/ && $0 !~ /unavailable/ {print $NF}' | tail -1)"
          if [ -z "$runtime" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No available iOS simulator runtime found; skipping iOS smoke."
            exit 0
          fi

          # PROWL-069: WDA now launches via `xcodebuild test-without-building`
          # (xctestrun), which iOS 26+ accepts, so every available runtime is
          # supported — no version gate.
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "supported=true" >> "$GITHUB_OUTPUT"

      - name: Boot the iOS simulator
        if: steps.ios-runtime.outputs.supported == 'true'
        env:
          IOS_RUNTIME: ${{ steps.ios-runtime.outputs.runtime }}
        run: |
          set -euo pipefail
          # Create the simulator if it does not already exist (safer than assuming).
          if ! xcrun simctl list devices | grep -q "$IOS_SIM"; then
            runtime="${IOS_RUNTIME:?}"
            devtype="com.apple.CoreSimulator.SimDeviceType.iPhone-16"
            echo "Creating simulator $IOS_SIM ($devtype, $runtime)"
            xcrun simctl create "$IOS_SIM" "$devtype" "$runtime"
          fi
          udid="$(
            xcrun simctl list devices --json | node -e '
              const fs = require("node:fs");
              const name = process.argv[1];
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              const devices = Object.values(data.devices ?? {}).flat()
                .filter((device) => device && device.isAvailable !== false);
              const matches = devices.filter((device) => device.name === name);
              if (matches.length !== 1) {
                const known = devices
                  .map((device) => device.name + " (" + device.udid + ", " + device.state + ")")
                  .join("; ") || "none";
                console.error("Expected exactly one available simulator named \"" + name + "\", found " + matches.length + ". Available simulators: " + known);
                process.exit(1);
              }
              process.stdout.write(matches[0].udid);
            ' "$IOS_SIM"
          )"
          echo "Using iOS simulator $IOS_SIM ($udid)"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid"
          echo "IOS_SIM_UDID=$udid" >> "$GITHUB_ENV"

      # PROWL-069: WDA is launched via `xcodebuild test-without-building` driven by
      # the generated `.xctestrun` (the XCTest host launch), which iOS 26+ accepts —
      # the older `simctl launch` of the xctrunner was terminated ("had no
      # entitlements"). This smoke now runs on iOS 18 and 26+ alike.
      - name: Run the iOS smoke hunt
        if: steps.ios-runtime.outputs.supported == 'true'
        working-directory: ${{ runner.temp }}/ios
        # WDA builds+caches under ~/.prowl/wda/ on first run (~110s); cached after.
        run: $PROWL run ios-smoke

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/android/.prowl/runs/**
            ${{ runner.temp }}/ios/.prowl/runs/**
            ${{ runner.temp }}/emulator.log

      - name: Tear down devices
        if: always()
        run: |
          adb -s emulator-5554 emu kill || true
          adb kill-server || true
          xcrun simctl shutdown "${IOS_SIM_UDID:-$IOS_SIM}" || true
