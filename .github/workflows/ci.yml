name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review/reopened are required so a draft->ready or reopen transition
    # re-runs CI, which is what triggers the workflow_run-chained prowl-review (#64).
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
